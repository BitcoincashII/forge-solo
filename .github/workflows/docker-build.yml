name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true

# Least privilege: each job's GITHUB_TOKEN (auto-provisioned, expires with the run) can do what that
# job does and no more. No long-lived PAT.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bitcoincashii/forge-solo

# SUPPLY-CHAIN NOTES:
# - Every third-party action is pinned to a full commit SHA (version in the trailing comment);
#   Dependabot (.github/dependabot.yml) proposes updates deliberately.
# - The node/node1175 Dockerfiles fetch each release tarball and sha256-verify it FAIL-CLOSED for
#   BOTH arches. That sha pin IS the arm64 publish gate: the pinned aarch64 1175 sha is exactly the
#   binary that passed the consensus unit suite + the reindex block-hash equivalence check, so a
#   build cannot produce an image from an unverified binary.

jobs:
  build:
    runs-on: ubuntu-latest
    # This job runs third-party actions and a privileged emulator image, so its token can push the
    # images and nothing else, and its checkout keeps no copy of it.
    permissions:
      contents: read
      packages: write
    outputs:
      node: ${{ steps.node.outputs.digest }}
      node1175: ${{ steps.node1175.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
      stratum: ${{ steps.stratum.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
      migrate: ${{ steps.migrate.outputs.digest }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set version (injection-safe via env)
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'VERSION=%s\n' "$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'VERSION=%s\n' "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      # The emulator and the builder run with full privileges over the release's build, so they are
      # pinned as the actions are: a tag can be moved, a digest cannot.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Node image (BCH2 v27.0.2)
        id: node
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker/node
          file: ./docker/node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-node:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Node1175 image (ESF v29.1.0)
        id: node1175
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker/node1175
          file: ./docker/node1175/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-node1175:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Stratum image
        id: stratum
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/stratum/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-stratum:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The migrator is built from this commit with every release and tagged with its version, so
      # it always knows the schema of the release it ships with.
      - name: Build and push Migrate image (forge-solo-migrate, PostgreSQL 16.15)
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/migrate/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-migrate:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Re-pin the compose file and the digest table to what was just published.
  #
  # This is the step that used to be done by hand and silently was not: the 1.0.8 release
  # bumped umbrel-app.yml and left the compose pinned at 1.0.0, so for eight releases this
  # repo would have installed the ORIGINAL images. Docker resolves name:tag@digest by DIGEST,
  # so bumping the tag alone ships the previous release under a new version number. Doing it
  # here means it cannot be forgotten, and packaging_test.go fails the build if the three
  # files ever disagree.
  repin:
    name: Re-pin digests on main
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the re-pin commit is pushed back to main
      actions: write    # Tests is run against the re-pinned main
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # A tag build has a detached HEAD; the re-pin belongs on the branch, not the tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Re-pin to the published digests
        env:
          V: ${{ needs.build.outputs.version }}
          D_NODE: ${{ needs.build.outputs.node }}
          D_NODE1175: ${{ needs.build.outputs.node1175 }}
          D_API: ${{ needs.build.outputs.api }}
          D_STRATUM: ${{ needs.build.outputs.stratum }}
          D_WEB: ${{ needs.build.outputs.web }}
          D_MIGRATE: ${{ needs.build.outputs.migrate }}
        run: |
          for d in "$D_NODE" "$D_NODE1175" "$D_API" "$D_STRATUM" "$D_WEB" "$D_MIGRATE"; do
            [ -n "$d" ] || { echo "::error::a build produced no digest; refusing to re-pin"; exit 1; }
          done
          scripts/repin-release.sh "$V" "$D_NODE" "$D_NODE1175" "$D_API" "$D_STRATUM" "$D_WEB" "$D_MIGRATE"

      # The guard that made this necessary must pass before anything is pushed.
      - name: Verify the three files agree
        run: go test -run 'TestCompose' -count=1 .

      - name: Show what would be pinned
        run: |
          git --no-pager diff --stat
          grep -oE 'forge-solo-[a-z0-9]+:[^@]+@sha256:[0-9a-f]{12}' docker-compose.yml

      # Everything above runs on a manual dispatch too, so the re-pin path is exercised
      # without cutting a release. Only the push is gated on an actual tag.
      - name: Commit the re-pin
        if: github.ref_type == 'tag'
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "already pinned to these digests; nothing to commit"
            exit 0
          fi
          git config user.name "BitcoincashII Dev"
          git config user.email "dev@bitcoincashii.org"
          git add docker-compose.yml packaging_test.go
          git commit -m "release: pin docker-compose to the ${V} digests CI published"
          git push origin HEAD:main

      # That push was made with GITHUB_TOKEN, which by design triggers no workflows. Without
      # this, main keeps showing the Tests failure from the window between the manifest bump
      # and the re-pin -- a red branch that is actually green.
      - name: Run Tests against the re-pinned main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
