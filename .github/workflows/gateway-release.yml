# Builds Forge Gateway for Linux and Windows and attaches the archives to a GitHub release.
# Triggered by a tag like gateway-v1.0.0 (separate from the app's v* tags).
name: Forge Gateway release

on:
  push:
    tags:
      - 'gateway-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./cmd/forge-gateway ./internal/blockbuild ./internal/tidesgw ./internal/stratum

      - name: Build and package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#gateway-v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            name="forge-gateway-${version}-${goos}-${goarch}"
            exe=forge-gateway; [ "$goos" = windows ] && exe=forge-gateway.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" -o "build/$name/$exe" ./cmd/forge-gateway
            cp LICENSE cmd/forge-gateway/README.md cmd/forge-gateway/forge-gateway.example.json "build/$name/"
            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              cp cmd/forge-gateway/forge-gateway.service "build/$name/"
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Forge Gateway ${GITHUB_REF_NAME#gateway-v}" \
            --notes "Mine into Forge Pool's TIDES window from your own BCH2 node. See cmd/forge-gateway/README.md. Verify downloads against SHA256SUMS."
