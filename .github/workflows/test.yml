name: Tests

# This repository had NO test job at all: the only workflow built and pushed images, and
# the Dockerfiles do not run tests either. Combined with two integration tests gated on
# environment variables whose provisioning scripts were never committed, that meant the
# checks covering aux-block acceptance and the 1175 payout ledger's fund-safety invariants
# had never executed since the repo was created.
on:
  push:
    branches: ['**']
  pull_request:
  # A push made with GITHUB_TOKEN does not trigger workflows -- GitHub's loop prevention --
  # so the release re-pin commit would otherwise leave main showing the failed run from the
  # window between the manifest bump and the re-pin. The repin job dispatches this.
  workflow_dispatch:

# Least privilege: reading the source is all any of this needs. No checkout keeps a copy of the
# job's token either: nothing here pushes, and the windows job mounts its checkout into a
# third-party image.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Every check below runs once Go is set up, whatever an earlier check did, so one failure does
    # not hide the others' results. On a release commit TestCompose fails by design until CI has
    # re-pinned the image digests; that used to skip every suite after the test step. The job
    # still fails if any check does.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt (whole tree)
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          # The whole tree, not a path list. It used to be a subset because inherited files
          # had never been gofmt-clean; they all are now, so anything narrower would let it
          # rot again in the files the list happened to miss.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go vet ./...

      # staticcheck finds what vet does not: code nothing reaches. Clean as of this commit; this
      # keeps it that way.
      #
      # Pinned to v0.7.0 (2026.1) for two reasons. A floating version would fail this build on
      # someone else's release schedule. And it must BUILD with the Go this job has: setup-go
      # exports GOTOOLCHAIN=local, so there is no automatic toolchain download, and v0.8.x
      # declared go >= 1.26.0 while go.mod pinned Go 1.25. v0.7.0 declares go 1.25.0 and builds
      # with the toolchain go.mod now pins (1.26.8); moving to v0.8.x is a separate change.
      - name: staticcheck
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go test -count=1 ./...

      # Forge Solo for Linux ships 32-bit builds (armv6l, armv7l, i686). On a 32-bit platform a
      # 64-bit atomic operation panics unless its word is 8-byte aligned, which only the
      # sync/atomic types guarantee; the 32-bit stratum crashed on its first miner that way.
      # 386 runs natively on this runner, so the whole suite runs as 32-bit here, as a step of its
      # own: on a release commit TestCompose fails by design.
      - name: Test as 32-bit (386)
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: CGO_ENABLED=0 GOARCH=386 go test -count=1 ./...

      - name: Build Forge Solo for Linux for every architecture it ships
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          for t in amd64: arm64: arm:7 arm:6 386: riscv64:; do
            arch=${t%%:*} arm=${t#*:}
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -o /dev/null ./cmd/forge-solo-linux
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -o /dev/null ./cmd/stratum
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -o /dev/null ./cmd/api
          done
          # forge-solo-migrate ships in the migrate image (amd64, arm64) and in the Windows installer.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./cmd/forge-solo-migrate
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/forge-solo-migrate

      # Every platform runs on SQLite, where the api and the stratum share one file and the move
      # replaces it under the in-use lock.
      - name: Test with race detector
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go test -count=1 -race ./internal/stratum/ ./cmd/stratum/ ./cmd/api/ ./internal/mining/ ./internal/stats/ ./internal/dblock/ ./internal/pgmigrate/ ./internal/migstatus/ ./cmd/forge-solo-migrate/

      - name: Build every binary
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go build ./...

  integration:
    name: Integration (the move to SQLite, live 1175 node)
    runs-on: ubuntu-latest
    # The move's end-to-end run builds the images and waits out three sweeps of the 1175 ledger.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The move is tested from a database 1.0.12's own code made: it needs the v1.0.12 tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Both steps run the SAME scripts a developer runs locally, so there is no second
      # copy of the provisioning logic to drift. Each script fails if a test it runs SKIPS, which
      # is what stops a silently-unopened gate from reading as a pass.
      #
      # 1.0.12's data, as its own code and the seed leave it, moved by the migrate image and the
      # compose as umbreld runs them, then compared in full; going back to 1.0.12 and forward
      # again; a move cut short, refused, deferred or damaged; the Windows shape.
      - name: The move from PostgreSQL to SQLite, end to end
        run: ./scripts/it-pg-to-sqlite.sh

      - name: Merge-mining end to end (live 1175 regtest node)
        run: ./scripts/it-1175.sh

  store-manifest:
    name: Store listing matches this repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Publishing a release means hand-copying umbrel-app.yml into the community store.
      # Nothing enforced that, and a missed copy is invisible -- the store went on serving
      # the old file while this repo looked correct. It is how the 3080 -> 31175 port fix
      # sat unmirrored for four releases, and how the store kept advertising "Automatic
      # solo payouts", a feature this app does not have.
      #
      # Fails on drift; only warns when the store cannot be reached, so a GitHub outage
      # does not read as a manifest problem.
      - name: Compare against the published store listing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-store-manifest.py

  images-public:
    name: Every pinned image pulls without a login
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub makes a package private when it is first published, and an Umbrel cannot log in to
      # pull: every install of the release, and every update to it, would fail. The release's re-pin
      # starts this run on main, which stays red here until each new package is public; the store is
      # synced only after that (README, "Releasing"). A registry that cannot be reached fails it too.
      - name: Fetch each pinned image's manifest without credentials
        run: scripts/check-images-public.sh

  windows:
    name: Windows launcher and installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The launcher is Windows-only code and its own module, so the unit job's ./... skips it.
      # Vetting and building it for any other GOOS proves nothing about what ships. Its config
      # is checked against the stratum's template by windows_config_test.go in the unit job.
      # staticcheck is the unit job's, at the same version, for the same reason: code nothing reaches.
      - name: Vet, staticcheck and build the launcher for Windows
        working-directory: windows/launcher
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/staticcheck" ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w" -o /tmp/forge-solo.exe .

      # Its logic (ports, stopping, the dashboard proxy) does not depend on Windows: only starting a
      # child without a console window does (proc_windows.go), so its tests run here. They are also
      # compiled for Windows, to be run on a Windows machine.
      - name: Test the launcher
        working-directory: windows/launcher
        run: |
          go test -race -count=1 ./...
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/launcher-test.exe .

      # Forge Gateway's tray app is Windows code and a module of its own, like Forge Solo's launcher,
      # so the unit job's ./... skips it.
      - name: Vet, staticcheck, build and test Forge Gateway's tray app
        working-directory: windows/gateway/launcher
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/staticcheck" ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w" -o /tmp/forge-gateway-tray.exe .
          go test -race -count=1 ./...
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/gateway-tray-test.exe .

      # Its Windows-only files (the service) are read by staticcheck only here: the unit job reads
      # the Linux build. staticcheck is the one the step before installed.
      - name: Vet, build and test Forge Gateway for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet ./cmd/forge-gateway
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/staticcheck" ./cmd/forge-gateway
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/forge-gateway
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./cmd/forge-gateway
          go test -race -count=1 ./cmd/forge-gateway ./internal/tidesgw

      # The services and forge-solo-migrate.exe as the release builds them for Windows. The tests of
      # the packages whose locking, renaming and paths differ on Windows are compiled for it too.
      # cmd/forge-solo-linux is Linux's alone.
      - name: Vet and build the services for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet ./cmd/stratum ./cmd/api ./cmd/forge-solo-migrate ./internal/...
          for c in stratum api forge-solo-migrate; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/$c
          done
          for p in internal/stats internal/dblock internal/pgmigrate; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./$p
          done

      # A release takes the Visual C++ runtime PostgreSQL needs from Microsoft's installer, at a
      # pinned URL with pinned checksums. Check that still works before a release depends on it.
      - name: The Visual C++ runtime for PostgreSQL extracts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq msitools p7zip-full
          mkdir -p /tmp/vcrt && python3 scripts/windows/vcruntime.py /tmp/vcrt

      # The installer script is only exercised at release time otherwise, and a syntax error or a
      # missing source path there fails the release rather than the change that caused it. The
      # executables and PostgreSQL are placeholders; the dashboard is the real one. PostgreSQL and
      # the migrator are in it, for an account with the data of 1.0.12 or before; the PostgreSQL
      # schema no longer is.
      - name: The installer script compiles
        env:
          INNOSETUP_IMAGE: 'amake/innosetup:innosetup6@sha256:81713b854eb12278021045dcb57701fe35312030b2dc1d37710184f294a23f81' # as in release.yml
        run: |
          mkdir -p windows/bin windows/pgsql/bin
          : > windows/bin/placeholder.txt; : > windows/bin/forge-solo-migrate.exe; : > windows/pgsql/bin/placeholder.txt
          chmod a+w windows
          docker run --rm -v "$PWD":/work "$INNOSETUP_IMAGE" /DMyAppVersion=0.0.0-check windows/forge-solo.iss | tee /tmp/iscc.log
          test -f windows/ForgeSolo-Setup-0.0.0-check.exe
          grep -q 'web\\dist\\settings.html' /tmp/iscc.log || { echo "::error::the dashboard is not in the installer"; exit 1; }
          grep -q 'bin\\forge-solo-migrate.exe' /tmp/iscc.log || { echo "::error::the migrator is not in the installer"; exit 1; }
          grep -q 'pgsql\\bin\\placeholder.txt' /tmp/iscc.log || { echo "::error::PostgreSQL is not in the installer"; exit 1; }
          if grep -q 'init-db.sql' /tmp/iscc.log; then echo "::error::the installer still installs the PostgreSQL schema"; exit 1; fi

      # Forge Gateway's installer, with placeholders for its programs, as its release builds it.
      - name: Forge Gateway's installer script compiles
        env:
          INNOSETUP_IMAGE: 'amake/innosetup:innosetup6@sha256:81713b854eb12278021045dcb57701fe35312030b2dc1d37710184f294a23f81' # as in release.yml
        run: |
          mkdir -p windows/gateway/bin
          : > windows/gateway/bin/forge-gateway.exe; : > windows/gateway/bin/forge-gateway-tray.exe; : > windows/gateway/bin/LICENSE.txt
          chmod a+w windows/gateway
          docker run --rm --network none -v "$PWD":/work "$INNOSETUP_IMAGE" /DMyAppVersion=0.0.0-check windows/gateway/forge-gateway.iss | tee /tmp/iscc-gw.log
          test -f windows/gateway/ForgeGateway-Setup-0.0.0-check.exe
          grep -q 'bin\\forge-gateway.exe' /tmp/iscc-gw.log || { echo "::error::forge-gateway.exe is not in Forge Gateway's installer"; exit 1; }
          grep -q 'bin\\forge-gateway-tray.exe' /tmp/iscc-gw.log || { echo "::error::the tray app is not in Forge Gateway's installer"; exit 1; }

  # What only Windows can show: its file locks and renames under a program that has the file open,
  # its code pages, its junctions, and a whole move from a data folder named in a script the code
  # page lacks, with the PostgreSQL and Visual C++ runtime the release ships. The jobs above run on
  # Linux and only compile the Windows code.
  windows-native:
    name: Windows natively (locks, code pages, junctions, a move)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The database's locks and the move's decisions and commit, on Windows
        run: |
          go test -count=1 -v ./internal/dblock | tee "$RUNNER_TEMP/locks.log"
          go test -count=1 -v ./internal/stats -run 'InUse|InitDBWaits|ApiAndStratum|Pragmas' | tee -a "$RUNNER_TEMP/locks.log"
          go test -count=1 -v ./internal/pgmigrate -run 'Commit|InUse|Plan' | tee "$RUNNER_TEMP/commit.log"
          if grep -h -- '--- SKIP' "$RUNNER_TEMP/locks.log" "$RUNNER_TEMP/commit.log"; then echo "::error::a test skipped"; exit 1; fi

      - name: The launcher's code page, junction and fast-path tests, on Windows
        working-directory: windows/launcher
        run: |
          go test -count=1 -v -run 'ACP|Junction|PgReachable|FastPath' . | tee "$RUNNER_TEMP/launcher.log"
          if grep -- '--- SKIP' "$RUNNER_TEMP/launcher.log" | grep -v TestMoveThroughAJunctionOnWindows; then echo "::error::a test skipped"; exit 1; fi

      - name: Forge Gateway and its tray app, on Windows
        run: |
          go test -count=1 -v ./cmd/forge-gateway | tee "$RUNNER_TEMP/gateway.log"
          (cd windows/gateway/launcher && go test -count=1 -v ./...) | tee -a "$RUNNER_TEMP/gateway.log"
          if grep -- '--- SKIP' "$RUNNER_TEMP/gateway.log"; then echo "::error::a test skipped"; exit 1; fi

      # With release.yml's own pins and script.
      - name: PostgreSQL and its Visual C++ runtime, as the release fetches them
        run: |
          PG_VERSION=$(sed -n "s/^  PG_VERSION: '\(.*\)'\$/\1/p" .github/workflows/release.yml)
          PG_SHA256=$(sed -n "s/^  PG_SHA256: '\(.*\)'\$/\1/p" .github/workflows/release.yml)
          curl -fsSL -o "$RUNNER_TEMP/pg.zip" "https://get.enterprisedb.com/postgresql/postgresql-${PG_VERSION}-1-windows-x64-binaries.zip"
          echo "${PG_SHA256}  $RUNNER_TEMP/pg.zip" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/pg" "$RUNNER_TEMP/pg.zip" 'pgsql/bin/*' 'pgsql/lib/*' 'pgsql/share/*' > /dev/null
          python scripts/windows/vcruntime.py "$RUNNER_TEMP/pg/pgsql/bin"
          test -f "$RUNNER_TEMP/pg/pgsql/bin/vcruntime140.dll"

      - name: A move through junctions, from folders named in a script the code page lacks
        run: |
          go build -o "$RUNNER_TEMP/forge-solo-migrate.exe" ./cmd/forge-solo-migrate
          cd windows/launcher
          FS_PGSQL="$RUNNER_TEMP/pg/pgsql" FS_MIGRATE="$RUNNER_TEMP/forge-solo-migrate.exe" FS_MOVED="$RUNNER_TEMP/moved.db" \
            go test -count=1 -v -run '^TestMoveThroughAJunctionOnWindows$' . | tee "$RUNNER_TEMP/move.log"
          grep -q -- '--- PASS: TestMoveThroughAJunctionOnWindows' "$RUNNER_TEMP/move.log"

      # scripts/it-pg-to-sqlite.sh moves the same rows on Linux and checks the same file. The path is the
      # package's own (go test runs there): Git Bash's $PWD would reach Go as /d/a/..., not D:\a\...
      - name: The moved database holds what the Linux run of the same rows holds
        run: |
          IT_DB="$RUNNER_TEMP/moved.db" IT_WANT=../../testdata/migrate/seed-1012.db.json \
            go test -count=1 -v -tags it -run '^TestITSnapshot$' ./internal/pgmigrate | tee "$RUNNER_TEMP/snapshot.log"
          grep -q -- '--- PASS: TestITSnapshot' "$RUNNER_TEMP/snapshot.log"

      # The Linux run checks that dashboard-snapshot.sh reads the same kept answers as the same files.
      # Here dashboard-snapshot.ps1 reads them under Windows PowerShell 5.1 and PowerShell 7, with the
      # runner in UTC and in two other zones: PowerShell 7 reads times as dates in the PC's own zone.
      # The runner and each PowerShell started in a zone must read that zone.
      - name: The dashboard snapshot reads the same on Windows as on Linux, in any time zone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $m = "$PWD\testdata\migrate"
          $snap = "$PWD\scripts\windows\dashboard-snapshot.ps1"
          $got = "$env:RUNNER_TEMP\dashboard.json"
          $failed = $false
          # A payout time a second later, and a miner's payouts shown differently between two 1.0.13
          # snapshots, must be found (1); a file that is not a snapshot is an error (2).
          $t = [IO.File]::ReadAllText("$m\dashboard-snapshot.json")
          $later = $t -creplace '("A-solo-payouts\.payouts\.1\.paidAt": "[^"]*)00Z"', '${1}01Z"'
          $payouts = $t -creplace '("A-payouts\.total": )2', '${1}3'
          if ($later -ceq $t -or $payouts -ceq $t) { Write-Output "::error::the changed snapshots are not changed"; exit 1 }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\later.json", $later, [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\payouts.json", $payouts, [Text.Encoding]::ASCII)
          foreach ($zone in 'UTC', 'Central Standard Time', 'Chatham Islands Standard Time') {
            Set-TimeZone -Id $zone
            # If the zone was not set, the runs below would pass in the zone before.
            if ((Get-TimeZone).Id -ne $zone) { Write-Output "::error::the runner's zone is $((Get-TimeZone).Id), not $zone"; $failed = $true }
            foreach ($ps in 'powershell', 'pwsh') {
              $seen = & $ps -NoProfile -Command '[TimeZoneInfo]::Local.Id'
              Write-Output "$ps started in $zone reads the zone as $seen"
              if ("$seen" -ne $zone) { Write-Output "::error::$ps started in $zone reads the zone as $seen"; $failed = $true }
              foreach ($c in @('dashboard', 'dashboard-snapshot.json'), @('dashboard-zones', 'dashboard-snapshot.json'),
                  @('dashboard-1012', 'dashboard-1012-snapshot.json'), @('dashboard-times', 'dashboard-times-snapshot.json')) {
                Remove-Item -Force -ErrorAction SilentlyContinue $got
                & $ps -NoProfile -ExecutionPolicy Bypass -File $snap -From "$m\$($c[0])" -Out $got
                $same = $LASTEXITCODE -eq 0 -and (Test-Path $got) -and
                  [Convert]::ToBase64String([IO.File]::ReadAllBytes("$m\$($c[1])")) -ceq [Convert]::ToBase64String([IO.File]::ReadAllBytes($got))
                if (-not $same) {
                  Write-Output "::error::$ps in $zone does not read $($c[0]) as dashboard-snapshot.sh does ($($c[1]))"
                  if (Test-Path $got) { fc.exe /n "$m\$($c[1])" $got }
                  $failed = $true
                }
              }
              & $ps -NoProfile -ExecutionPolicy Bypass -File $snap -Before "$m\dashboard-1012-snapshot.json" -After "$m\dashboard-snapshot.json"
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::$ps in $zone finds the kept 1.0.12 and 1.0.13 snapshots differ"; $failed = $true }
              & $ps -NoProfile -ExecutionPolicy Bypass -File $snap -Before "$m\dashboard-1012-snapshot.json" -After "$env:RUNNER_TEMP\later.json"
              if ($LASTEXITCODE -ne 1) { Write-Output "::error::$ps in $zone misses a payout time a second later"; $failed = $true }
              & $ps -NoProfile -ExecutionPolicy Bypass -File $snap -Before "$m\dashboard-snapshot.json" -After "$env:RUNNER_TEMP\payouts.json"
              if ($LASTEXITCODE -ne 1) { Write-Output "::error::$ps in $zone misses a change between two 1.0.13 snapshots"; $failed = $true }
              & $ps -NoProfile -ExecutionPolicy Bypass -File $snap -Before "$m\dashboard\health.json" -After "$m\dashboard-snapshot.json"
              if ($LASTEXITCODE -ne 2) { Write-Output "::error::$ps in $zone takes a file that is not a snapshot for one"; $failed = $true }
            }
          }
          Set-TimeZone -Id UTC
          if ($failed) { exit 1 }
          # The runner ends the step with the last program's exit code: a compare above that found a
          # difference, as it had to.
          exit 0

      # Run from a prompt, as its usage lines are, the .ps1 runs in that PowerShell session, where
      # Set-Location moves PowerShell's location but not the process's directory. Here it runs that
      # way, with every path relative to a location that is not the process's directory: what it
      # saves and writes must be there, and read back the same. It takes seconds: one that hangs is
      # stopped long before the job's time limit.
      - name: The dashboard snapshot, run in the session, takes relative paths from its location
        shell: powershell
        timeout-minutes: 5
        run: |
          $m = "$PWD\testdata\migrate"
          $snap = "$PWD\scripts\windows\dashboard-snapshot.ps1"
          $kept = "$m\dashboard-snapshot.json"
          $failed = $false
          # A dashboard on 127.0.0.1 that gives the kept answers with their status: /api/v1/pool/config is
          # pool-config.json, /api/v1/miners/A is A-miner.json, /api/v1/miners/A/blocks is A-blocks.json.
          $listener = New-Object Net.Sockets.TcpListener ([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $server = [PowerShell]::Create().AddScript({
            param($listener, $dir)
            $ErrorActionPreference = 'Stop'
            while ($true) {
              $client = $listener.AcceptTcpClient()
              try {
                $stream = $client.GetStream()
                $reader = New-Object IO.StreamReader $stream
                $path = ($reader.ReadLine() -split ' ')[1]
                while ($reader.ReadLine()) { }
                $name = ($path -replace '^/api/v1/', '' -replace '^miners/([^/]+)$', '$1/miner' -replace '^miners/', '') -replace '/', '-'
                $raw = [IO.File]::ReadAllBytes("$dir\$name.json")
                $nl = [Array]::IndexOf($raw, [byte]10)
                $status = ([Text.Encoding]::ASCII.GetString($raw, 0, $nl) -split ' ')[1]
                $head = [Text.Encoding]::ASCII.GetBytes("HTTP/1.1 $status Kept`r`nContent-Length: $($raw.Length - $nl - 1)`r`nConnection: close`r`n`r`n")
                $stream.Write($head, 0, $head.Length)
                $stream.Write($raw, $nl + 1, $raw.Length - $nl - 1)
              } finally {
                $client.Close()
              }
            }
          }).AddArgument($listener).AddArgument("$m\dashboard")
          [void]$server.BeginInvoke()
          # The server's thread keeps powershell.exe from exiting until the listener stops. It is
          # stopped however the step ends, an early exit or an error included: otherwise the step
          # hangs instead of failing.
          try {
            $env:MINERS = 'A=A B=B C=C'
            function Same($got) {
              (Test-Path -LiteralPath $got) -and [Convert]::ToBase64String([IO.File]::ReadAllBytes($got)) -ceq [Convert]::ToBase64String([IO.File]::ReadAllBytes($kept))
            }
            $here = "$env:RUNNER_TEMP\here"
            New-Item -ItemType Directory -Force $here | Out-Null
            Set-Location $here
            if ([Environment]::CurrentDirectory -eq $here) { Write-Output "::error::the process's directory is $here too: this proves nothing"; exit 1 }
            try {
              & $snap -Base "http://127.0.0.1:$port" -Out before.json -Save answers
            } catch {
              Write-Output "::error::-Base with -Out before.json -Save answers failed in the session: $_"; $failed = $true
            }
            if (-not (Same "$here\before.json")) { Write-Output "::error::-Out before.json wrote no snapshot of the kept answers in the location"; $failed = $true }
            if (-not (Test-Path -LiteralPath "$here\answers\health.json")) { Write-Output "::error::-Save answers kept no answers in the location"; $failed = $true }
            try {
              & $snap -From answers -Out again.json
            } catch {
              Write-Output "::error::-From answers -Out again.json failed in the session: $_"; $failed = $true
            }
            if (-not (Same "$here\again.json")) { Write-Output "::error::-From answers did not read the saved answers as the kept snapshot"; $failed = $true }
            & $snap -Before before.json -After $kept
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::-Before before.json gave $LASTEXITCODE in the session, not 0"; $failed = $true }
            & $snap -Before $kept -After again.json
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::-After again.json gave $LASTEXITCODE in the session, not 0"; $failed = $true }
            # A path on a drive that is not there is a file that cannot be read.
            try {
              & $snap -Before nodrive:\before.json -After $kept
            } catch {
              Write-Output "::error::-Before on a drive that is not there failed in the session: $_"; $failed = $true
            }
            if ($LASTEXITCODE -ne 2) { Write-Output "::error::-Before on a drive that is not there gave $LASTEXITCODE in the session, not 2"; $failed = $true }
          } finally {
            $listener.Stop()
          }
          if ($failed) { exit 1 }
          exit 0
