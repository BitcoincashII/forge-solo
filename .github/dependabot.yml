version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Go modules and the images the app is built on: fasthttp sat at a version two years and
  # one advisory old with nothing proposing the update. The Windows launcher is a module of its
  # own, and Dependabot reads only the directories listed here.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/windows/launcher"
      - "/windows/gateway/launcher"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/docker/api"
      - "/docker/stratum"
      - "/docker/web"
      - "/docker/node"
      - "/docker/node1175"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/docker/migrate"
    schedule:
      interval: "weekly"
    # The image's PostgreSQL only reads the database 1.0.12 wrote (PostgreSQL 16 data): a newer major
    # cannot open it, so only 16.x updates are offered.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
