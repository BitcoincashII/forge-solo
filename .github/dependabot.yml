version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Go modules and the images the app is built on: fasthttp sat at a version two years and
  # one advisory old with nothing proposing the update.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/docker/api"
      - "/docker/stratum"
      - "/docker/web"
      - "/docker/postgres"
      - "/docker/node"
      - "/docker/node1175"
    schedule:
      interval: "weekly"
