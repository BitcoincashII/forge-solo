version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Go modules and the images the app is built on: fasthttp sat at a version two years and
  # one advisory old with nothing proposing the update. The Windows launchers are modules of their
  # own, and Dependabot reads only the directories listed here.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  # Forge Solo's and Forge Gateway's Windows launchers share code and must build with the same
  # versions (windows/gateway/launcher/drift_test.go). Without the group, Dependabot updates each
  # folder in a pull request of its own, which fails that test until the other one is updated too.
  - package-ecosystem: "gomod"
    directories:
      - "/windows/launcher"
      - "/windows/gateway/launcher"
    schedule:
      interval: "weekly"
    groups:
      windows-launchers:
        group-by: dependency-name
  - package-ecosystem: "docker"
    directories:
      - "/docker/api"
      - "/docker/stratum"
      - "/docker/web"
    schedule:
      interval: "weekly"
  # The BCH2 v27.0.2 release binary loads libminiupnpc.so.17, which Ubuntu 26.04 does not have (it has
  # libminiupnpc.so.21), so the BCH2 node image stays on Ubuntu 24.04. The 1175 node image stays with
  # it: on an Umbrel the two share that base, downloaded and stored once. So no later Ubuntu is offered,
  # and not 24.10 either, which is past its end of life.
  - package-ecosystem: "docker"
    directories:
      - "/docker/node"
      - "/docker/node1175"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/docker/migrate"
    schedule:
      interval: "weekly"
    # The image's PostgreSQL only reads the database 1.0.12 wrote (PostgreSQL 16 data): a newer major
    # cannot open it, so only 16.x updates are offered.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
