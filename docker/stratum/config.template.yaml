# Forge Solo — stratum config (rendered from env by entrypoint.sh via envsubst).
# SOLO ONLY: no PPLNS, no Stratum V2 (it is refused at startup -- see cmd/stratum).
# Merge-mines 1175 (ESF). Two stratum ports: 3333 for your own hardware and for Braiins
# (which connects each miner individually), 3335 for NiceHash / MiningRigRentals (which
# put a whole order behind one connection). Both ship the 4 + 8 extranonce sizing
# marketplaces require.

pool:
  name: "Forge Solo"
  coin: "Bitcoin Cash II"
  coin_symbol: "BCH2"
  address: "${POOL_ADDRESS}"
  block_reward: 50.0
  payout_scheme: "solo"
  coinbase_tag: "${COINBASE_TAG}"

stratum:
  host: "0.0.0.0"
  port: 3333
  max_connections: 256          # home use — a handful of miners
  max_shares_per_second: 100
  extranonce1_size: 4          # full 32-bit session counter; 2 aliased after 65536 subscribes
  extranonce2_size: 8          # Braiins requires >7 — do not shrink this to rebalance
  vardiff:
    enabled: true
    min_diff: 1024              # low floor so small ASICs (e.g. Bitaxe) submit steadily
    max_diff: 1000000000000
    target_time: 5               # matches the production pool's Braiins profile
    retarget_time: 10            # fast retarget so an individual miner finds its level quickly
    variance_percent: 25         # dead-band around target_time: vardiff only adjusts outside +/-this

# Second stratum: PROXIED rental hashpower (NiceHash / MiningRigRentals).
#
# Those marketplaces aggregate many miners behind ONE connection, so the aggregate arrives
# as a single client and needs a high starting difficulty -- 500k is what they publish and
# what the production pool uses. Braiins does NOT belong here: it connects each miner
# individually, so it uses the main port on 3333 and vardiffs per miner from the 1024 floor.
#
# Keeping the two on separate PORTS is what removes the need to guess from a user agent.
# Substring-matching "proxy" once stranded a home farm behind a stratum proxy at 500k;
# a port carries its own profile and cannot misidentify anyone.
stratum_rental:
  enabled: true
  host: "0.0.0.0"          # published on 3335 in docker-compose.yml
  port: 3335
  max_connections: 64
  extranonce1_size: 4      # must sum with extranonce2_size to the coinbase reserve (12)
  extranonce2_size: 8      # >7; NiceHash/MRR and Braiins all require it
  vardiff:
    enabled: true
    min_diff: 500000       # aggregate PH/s arrives on one connection; ramps from here
    max_diff: 1000000000000
    target_time: 5
    retarget_time: 10

stratumv2:
  enabled: false

node:
  host: "${NODE_HOST}"
  port: ${NODE_PORT}
  use_ssl: false
  zmq_endpoint: "${ZMQ_ENDPOINT}"

# Merge-mining 1175 (ESF) via AuxPoW — inert until the 1175 chain activates AuxPoW,
# then automatically engages. Set your 1175 (esf1...) address in the app settings.
mergemining:
  enabled: true
  payout_address: "${PAYOUT_ADDRESS_1175}"
  aux_node:
    host: "${AUX1175_HOST}"
    port: ${AUX1175_PORT}
    user: "${AUX1175_USER}"
    pass: "${AUX1175_PASSWORD}"

logging:
  level: "info"
  format: "json"
