# Forge Solo — stratum config (rendered from env by entrypoint.sh via envsubst).
# SOLO ONLY: no PPLNS, no Stratum V2 (it is refused at startup -- see cmd/stratum).
# Merge-mines 1175 (ESF). Rented hashpower uses the SAME port as your own hardware, 3333:
# it already ships the 2 + 8 extranonce sizing marketplaces require.

pool:
  name: "Forge Solo"
  coin: "Bitcoin Cash II"
  coin_symbol: "BCH2"
  address: "${POOL_ADDRESS}"
  solo_fee: 0.0                 # home miner keeps 100% — no pool fee
  block_reward: 50.0
  payout_scheme: "solo"
  # INERT in solo. A solo block is paid by its own coinbase and the settle stamps the payout
  # row txid='coinbase-direct', while the sender only ever considers rows with a NULL/empty
  # txid -- so no solo balance can reach the threshold this would gate, and payMiner is
  # unreachable. Kept only so the template still renders MIN_PAYOUT.
  min_payout: ${MIN_PAYOUT}
  coinbase_tag: "${COINBASE_TAG}"

stratum:
  host: "0.0.0.0"
  port: 3333
  max_connections: 256          # home use — a handful of miners
  max_shares_per_second: 100
  extranonce1_size: 2
  extranonce2_size: 8
  vardiff:
    enabled: true
    min_diff: 1024              # low floor so small ASICs (e.g. Bitaxe) submit steadily
    max_diff: 1000000000000
    target_time: 10
    retarget_time: 30
    variance_percent: 25         # dead-band around target_time: vardiff only adjusts outside +/-this

# Disabled — not applicable to a single-household solo miner.
stratum_braiins:
  enabled: false           # DEAD on Umbrel and must stay that way. It cannot be turned on from an
                           # install: this file is baked into a digest-pinned image with no volume,
                           # entrypoint.sh only runs envsubst (which cannot touch a literal `false`),
                           # host is 127.0.0.1, and 3335 is not published. Rented hashpower does not
                           # need it -- port 3333 already uses the same 2 + 8 extranonce sizing.
  host: "127.0.0.1"
  port: 3335
  max_connections: 1000
  extranonce1_size: 2
  extranonce2_size: 8
  vardiff:
    enabled: true
    min_diff: 500000       # high floor for PH/s rentals (ramps from here)
    max_diff: 1000000000000
    target_time: 5
    retarget_time: 10
stratumv2:
  enabled: false

node:
  host: "${NODE_HOST}"
  port: ${NODE_PORT}
  use_ssl: false
  zmq_endpoint: "${ZMQ_ENDPOINT}"

# Merge-mining 1175 (ESF) via AuxPoW — inert until the 1175 chain activates AuxPoW,
# then automatically engages. Set your 1175 (esf1...) address in the app settings.
mergemining:
  enabled: true
  payout_address: "${PAYOUT_ADDRESS_1175}"
  # Also inert: 1175 is coinbase-direct too, and min1175Payout is never read except to log
  # itself at startup.
  min_payout: ${MIN_PAYOUT}
  aux_node:
    host: "${AUX1175_HOST}"
    port: ${AUX1175_PORT}
    user: "${AUX1175_USER}"
    pass: "${AUX1175_PASSWORD}"
    wallet: "${AUX1175_WALLET}"

logging:
  level: "info"
  format: "json"
