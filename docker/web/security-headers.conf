# Sent with every response, the API's through the proxy included. Each location that adds a header
# of its own must include this file again: nginx drops the server's add_header lines wherever a
# location has any.
#
# No other site may show these pages in a frame: framed invisibly, two clicks on another page
# changed the payout mode in a review (umbrelOS opens apps in their own tab and never frames them).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
