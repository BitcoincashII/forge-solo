# forgesolo.bch2.org: Forge Solo's website, the static files of site/ in
# https://github.com/BitcoincashII/forge-solo, which site/deploy.sh copies to /var/www/forgesolo.
#
# A draft for the pool box (144.202.73.66), modelled on its pool.bch2.org and forge.bch2.org. On the
# box it is /etc/nginx/sites-available/forgesolo.bch2.org, linked from sites-enabled. site/README.md
# has the one-time setup: the port-80 server first (everything above the line "# HTTPS"), then the
# certificate, then the whole file. Test with nginx -t before every reload.
#
# The name points straight at the box, not through Cloudflare as pool.bch2.org does, so nginx ends
# TLS itself and Let's Encrypt's HTTP-01 challenge reaches the server below on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name forgesolo.bch2.org;
    server_tokens off;

    # The certificate renews the way the box's others do: certbot's webroot authenticator, and nginx
    # reloaded after. The webroot is /var/www/letsencrypt, as for forge.bch2.org and
    # hashforge.bch2.org, outside the site's root, so a deploy can never touch a challenge. Not a
    # server-level return: that runs before a location is chosen, and the challenge would get it too.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name forgesolo.bch2.org;

    ssl_certificate     /etc/letsencrypt/live/forgesolo.bch2.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgesolo.bch2.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/forgesolo;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css image/svg+xml;

    # pool.bch2.org's security headers, with these differences: the page is never framed, so
    # X-Frame-Options is DENY and the policy has frame-ancestors 'none'; a Content-Security-Policy
    # that lets the page load its own styles, font and images and nothing else (it has no script);
    # and HSTS, since this name has no Cloudflare in front and is only ever served over HTTPS.
    #
    # No location below may have an add_header of its own: nginx would then send none of these for
    # it (pool.bch2.org's "location ~ \.html$" has one, so its pages go out without them). The
    # locations set caching with expires, which leaves them in place.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A folder with no index.html (/css/, /img/, /fonts/) is a 403 in nginx: the 404 page there too.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        # The pages: the browser asks again every time, and gets 304 while they have not changed.
        expires -1;
    }

    location = /404.html {
        internal;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Nothing the site serves starts with a dot. Before the next one: nginx takes the first regular
    # expression that matches.
    location ~ /\. {
        return 404;
    }

    # The stylesheet, the images and the font: a week. A page links a changed stylesheet with a new
    # ?v=, as pool.bch2.org does.
    location ~* \.(css|svg|png|woff2)$ {
        expires 7d;
    }
}
