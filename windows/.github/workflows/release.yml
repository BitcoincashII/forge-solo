name: Release

# Builds the complete Windows installer in CI and publishes it signed, so a release is
# reproducible from public sources instead of whatever happened to be on someone's laptop.
#
# Everything the installer contains is fetched here and sha256-verified fail-closed: both node
# binaries come from their own published releases, PostgreSQL from EnterpriseDB, and the three
# Go executables are compiled from the app repo at a pinned ref. The result is ONE
# ForgeSolo-Setup-<version>.exe -- there is no separate zip, because a user who downloads the
# wrong one of two assets ends up with something that does not install.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'forge-solo ref to build the services from'
        default: 'main'
      version:
        description: 'Version to stamp (defaults to the tag, or 0.0.0-dev)'
        default: ''

permissions:
  contents: write   # required to create the release

env:
  # Pinned and verified. Bumping any of these means bumping its hash in the same commit.
  BCH2_VERSION: '27.0.2'
  BCH2_SHA256: '751a854418571fc6d0e5a64f52ee4bd54dbc50a10a889ea5a35f0336bdb33519'
  ESF_VERSION: '29.1.0'
  ESF_SHA256: 'd9143e968b500ad042402d582d26255a40f52ce57f52fb46673d2b7726d55632'
  PG_VERSION: '16.10'
  PG_SHA256: 'ebb3b6af4fa69dea9951b66855bc4d42dc04e56ccb9aa7024ce3c58bd89d6b0c'

jobs:
  installer:
    name: Build and sign the installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout the app the services are built from
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: BitcoincashII/forge-solo
          ref: ${{ github.event.inputs.app_ref || 'main' }}
          path: app

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod

      # A tag build takes the app from main, which moves. Record the exact commit so the
      # release says what it was built from rather than leaving it to be inferred later.
      - name: Record the app commit
        id: app
        run: echo "sha=$(cd app && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the version being built
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      # The dashboard is a verbatim mirror of the app's web/dist. Taking it from the app repo
      # rather than this one removes the chance of shipping a stale copy.
      - name: Take the dashboard from the app
        run: rm -rf web && cp -r app/web/dist web

      - name: Build the three executables
        run: |
          mkdir -p bin
          (cd app && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags '-s -w' -o ../bin/stratum.exe ./cmd/stratum)
          (cd app && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags '-s -w' -o ../bin/api.exe     ./cmd/api)
          go install github.com/akavel/rsrc@v0.10.2
          (cd launcher && "$(go env GOPATH)/bin/rsrc" -ico forge-solo.ico -arch amd64 -o rsrc.syso)
          (cd launcher && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w" -o ../bin/forge-solo.exe .)

      # Present on GitHub's Ubuntu images, but the whole build depends on it, so do not
      # assume the image never changes.
      - name: Ensure 7z is available
        run: command -v 7z >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Fetch the BCH2 node
        run: |
          curl -fsSL -o /tmp/bch2.zip \
            "https://github.com/BitcoincashII/bitcoincashII-core/releases/download/v${BCH2_VERSION}/bitcoincashII-${BCH2_VERSION}-win64.zip"
          echo "${BCH2_SHA256}  /tmp/bch2.zip" | sha256sum -c -
          7z x -y -o/tmp/bch2 /tmp/bch2.zip > /dev/null
          cp "/tmp/bch2/bitcoincashII-${BCH2_VERSION}-win64/bitcoincashIId.exe" bin/

      # 1175 publishes an NSIS installer rather than a zip, so the daemon is extracted from it.
      - name: Fetch the 1175 node
        run: |
          curl -fsSL -o /tmp/esf.exe \
            "https://github.com/1175Dev/1175/releases/download/v${ESF_VERSION}/elevenseventyfive-${ESF_VERSION}-win64-setup.exe"
          echo "${ESF_SHA256}  /tmp/esf.exe" | sha256sum -c -
          7z x -y -o/tmp/esf /tmp/esf.exe > /dev/null
          cp /tmp/esf/daemon/elevenseventyfived.exe bin/

      # Only bin, lib and share: the rest of the archive is pgAdmin and headers this never runs.
      # Stay on 16.x -- a data directory is bound to its major version, so 17.x would leave every
      # existing install unable to start its database.
      - name: Fetch PostgreSQL
        run: |
          curl -fsSL -o /tmp/pg.zip \
            "https://get.enterprisedb.com/postgresql/postgresql-${PG_VERSION}-1-windows-x64-binaries.zip"
          echo "${PG_SHA256}  /tmp/pg.zip" | sha256sum -c -
          rm -rf pgsql && mkdir -p pgsql
          7z x -y -o/tmp/pg /tmp/pg.zip 'pgsql/bin/*' 'pgsql/lib/*' 'pgsql/share/*' > /dev/null
          cp -a /tmp/pg/pgsql/bin /tmp/pg/pgsql/lib /tmp/pg/pgsql/share pgsql/
          test -f pgsql/bin/postgres.exe

      # The Inno Setup image runs as uid 1000 while the runner's workspace is owned by uid
      # 1001, so the container cannot create its output here and the compile dies with
      # "Access denied". Only the directory itself needs to be writable -- the inputs are
      # world-readable already. This does not reproduce locally, where the checkout happens
      # to be uid 1000 too.
      - name: Compile the installer
        run: |
          chmod a+w .
          docker run --rm -v "$PWD":/work amake/innosetup \
            /DMyAppVersion=${{ steps.ver.outputs.version }} forge-solo.iss
          test -f "ForgeSolo-Setup-${{ steps.ver.outputs.version }}.exe"

      # A tag build must not publish an unsigned installer, so the secret is required there.
      # A manual run without it still produces an installer, for testing the build itself.
      - name: Sign the installer
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          SETUP="ForgeSolo-Setup-${{ steps.ver.outputs.version }}.exe"
          if [ -z "$PFX_B64" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::WINDOWS_SIGNING_PFX_B64 is not set; refusing to publish an unsigned release."
              exit 1
            fi
            echo "::warning::No signing secret; leaving the installer unsigned (not a tag build)."
            exit 0
          fi
          printf '%s' "$PFX_B64" | base64 -d > /tmp/signing.pfx
          docker run --rm -v "$PWD":/w -v /tmp:/s -w /w --entrypoint osslsigncode amake/innosetup \
            sign -pkcs12 /s/signing.pfx -pass "$PFX_PASS" \
            -n "Forge Solo" -i "https://github.com/${GITHUB_REPOSITORY}" \
            -h sha256 -in "$SETUP" -out "/w/signed.exe"
          mv signed.exe "$SETUP"
          shred -u /tmp/signing.pfx 2>/dev/null || rm -f /tmp/signing.pfx

      # Reads the PE certificate table directly rather than trusting the signer's exit code.
      - name: Verify the signature is present
        run: |
          python3 - "ForgeSolo-Setup-${{ steps.ver.outputs.version }}.exe" <<'EOF'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          pe = struct.unpack_from('<I', d, 0x3c)[0]
          magic = struct.unpack_from('<H', d, pe + 24)[0]
          dd = pe + 24 + (112 if magic == 0x20b else 96)
          _, size = struct.unpack_from('<II', d, dd + 4 * 8)   # index 4 = certificate table
          print(f"certificate table: {size} bytes")
          if size == 0:
              print("::warning::installer is not signed")
          EOF

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ForgeSolo-Setup-${{ steps.ver.outputs.version }}
          path: ForgeSolo-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      # One asset. Two would mean a user can pick the one that does not install.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP="ForgeSolo-Setup-${{ steps.ver.outputs.version }}.exe"
          sha256sum "$SETUP" | tee SHA256SUMS
          cat > /tmp/provenance.md <<NOTE
          Built and signed by CI from a clean runner.

          | | |
          |---|---|
          | Services built from | \`BitcoincashII/forge-solo@${{ steps.app.outputs.sha }}\` |
          | BCH2 node | ${BCH2_VERSION} |
          | 1175 node | ${ESF_VERSION} |
          | PostgreSQL | ${PG_VERSION} |

          Every bundled component is fetched during the build and sha256-verified.
          \`SHA256SUMS\` below covers the installer itself.
          NOTE
          # What changed goes first: the section of RELEASE_NOTES.md headed "## <version>".
          awk -v h="## ${{ steps.ver.outputs.version }}" '$0 == h {on = 1; next} /^## / {on = 0} on' \
            RELEASE_NOTES.md > /tmp/changes.md
          {
            if grep -q '[^[:space:]]' /tmp/changes.md; then cat /tmp/changes.md; printf '\n---\n\n'; fi
            cat /tmp/provenance.md
          } > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" "$SETUP" SHA256SUMS \
            --title "Forge Solo ${{ steps.ver.outputs.version }}" \
            --notes-file /tmp/notes.md
