version: "3.7"

# Forge Solo — self-hosted SOLO mining for home miners.
# Mine BCH2 solo to your OWN address and merge-mine 1175 (ESF) at no extra hashrate cost.
# One household, solo only. All secrets are generated per-install by exports.sh; node RPC
# ports are never published to the host — services talk over the private app network by
# service name, and app_proxy fronts the web dashboard (standard Umbrel pattern).

services:
  app_proxy:
    environment:
      APP_HOST: bch2-apps-forge-solo_web_1
      APP_PORT: 80

  node:
    image: ghcr.io/bitcoincashii/forge-solo-node:1.0.9@sha256:d66ec1434c8114ae057222f4877711a91c80abea97527d3a09c60365aa4bbc9a
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # BCH2 peer-to-peer. Published so the node can ACCEPT inbound peers, not just make
      # outbound ones. Forward 8339 in your router to actually receive them. The RPC port
      # is deliberately NOT published -- it stays on the app's private network.
      - "8339:8339"
    volumes:
      - ${APP_DATA_DIR}/node:/data/.bch2
    environment:
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
    command:
      - -datadir=/data/.bch2
      - -printtoconsole
      - -listen=1                 # accept inbound peers (forward 8339 in your router)
      - -prune=2000
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge
      - -rpcpassword=${APP_NODE_RPC_PASSWORD}
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -zmqpubrawblock=tcp://0.0.0.0:28332
    healthcheck:
      test: ["CMD-SHELL", "bitcoincashII-cli -datadir=/data/.bch2 -rpcuser=forge -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  node1175:
    image: ghcr.io/bitcoincashii/forge-solo-node1175:1.0.9@sha256:389416122fec21808e6649608639ac27e7d11680b354f1960c70a12f1feb2052
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # 1175 (ESF) peer-to-peer, same reasoning as the BCH2 node above.
      - "25360:25360"
    volumes:
      - ${APP_DATA_DIR}/node1175:/data/.elevenseventyfive
    environment:
      - RPC_USER=forge1175
      - RPC_PASSWORD=${APP_1175_RPC_PASSWORD}
    command:
      - -datadir=/data/.elevenseventyfive
      - -printtoconsole
      - -listen=1                 # accept inbound peers (forward 25360 in your router)
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge1175
      - -rpcpassword=${APP_1175_RPC_PASSWORD}
      - -wallet=pool
    healthcheck:
      test: ["CMD-SHELL", "elevenseventyfive-cli -datadir=/data/.elevenseventyfive -rpcuser=forge1175 -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: forgesolo
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forgesolo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/bitcoincashii/forge-solo-api:1.0.9@sha256:be8e1620cd769f7453ab7bbc92049449bea4b3abe7099674e75abe1a61ff67b0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=forge
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - DB_NAME=forgesolo
      - DB_SSLMODE=disable
      - RPC_URL=http://node:8342
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - STRATUM_INTERNAL_URL=http://stratum:3337
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - POOL_NAME=${POOL_NAME:-Forge Solo}
      # The api reads these as fallbacks for a fresh install; without them here its
      # fallback branches could never fire, so a user who configured the tag or the 1175
      # address in the Umbrel app config saw "not configured — merge-mining OFF" while
      # merge mining was in fact running, and a tag box reading "Forge" while blocks
      # carried the real one -- which the next Save would then overwrite.
      - COINBASE_TAG=${COINBASE_TAG:-Forge}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
      - HOME_APP=1
      - CORS_ORIGINS=
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  stratum:
    image: ghcr.io/bitcoincashii/forge-solo-stratum:1.0.9@sha256:bed38e46d29f616696956dbe6f4c15387676dd6876d92b902755d6ebd2385ce1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      node1175:
        condition: service_started
    ports:
      - "3333:3333"   # your own hardware, and Braiins (which connects each miner individually)
      - "3335:3335"   # proxied rental hashpower: NiceHash / MiningRigRentals
    environment:
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      - INTERNAL_STATS_HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - API_PORT=3337
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=forge
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - DB_NAME=forgesolo
      - DB_SSLMODE=disable
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - NODE_HOST=node
      - NODE_PORT=8342
      - ZMQ_ENDPOINT=tcp://node:28332
      - AUX1175_HOST=node1175
      - AUX1175_PORT=25359
      - AUX1175_USER=forge1175
      - AUX1175_PASSWORD=${APP_1175_RPC_PASSWORD}
      - AUX1175_WALLET=pool
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - COINBASE_TAG=${COINBASE_TAG:-Forge}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3333 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/bitcoincashii/forge-solo-web:1.0.9@sha256:2a2e532ca9d9cdb2b7db6a8e76a6d581b6159fe906e2a160b39e9e148b711d4a
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_URL=http://api:8080
